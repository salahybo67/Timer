<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyber Neon Timer</title>
  <style>
    :root {
      --bg-color: #0b0d19;
      --card-bg: rgba(22, 27, 46, 0.7);
      --accent-cyan: #00f0ff;
      --accent-pink: #ff007f;
      --text-color: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      background-image: 
        radial-gradient(at 20% 20%, rgba(0, 240, 255, 0.15) 0px, transparent 50%),
        radial-gradient(at 80% 80%, rgba(ff, 0, 127, 0.15) 0px, transparent 50%);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .container {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 40px;
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5),
                  0 0 30px rgba(0, 240, 255, 0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 30px;
    }

    h1 {
      font-size: 1.5rem;
      text-transform: uppercase;
      letter-spacing: 4px;
      color: var(--accent-cyan);
      text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
    }

    /* Timer Dial & Ring */
    .timer-display {
      position: relative;
      width: 280px;
      height: 280px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .progress-ring {
      transform: rotate(-90deg);
    }

    .progress-ring__circle-bg {
      stroke: rgba(255, 255, 255, 0.05);
    }

    .progress-ring__circle {
      stroke: url(#gradient);
      stroke-linecap: round;
      transition: stroke-dashoffset 0.3s ease;
      filter: drop-shadow(0 0 8px var(--accent-cyan));
    }

    .time-text {
      position: absolute;
      font-size: 3.5rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
    }

    /* Buttons */
    .controls {
      display: flex;
      gap: 15px;
    }

    .btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: var(--text-color);
      padding: 12px 28px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 30px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .btn:hover {
      background: var(--accent-cyan);
      color: #000;
      box-shadow: 0 0 15px var(--accent-cyan);
      border-color: var(--accent-cyan);
      transform: translateY(-2px);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn-secondary:hover {
      background: var(--accent-pink);
      color: #fff;
      box-shadow: 0 0 15px var(--accent-pink);
      border-color: var(--accent-pink);
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Focus Session</h1>
    
    <div class="timer-display">
      <svg class="progress-ring" width="280" height="280">
        <defs>
          <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#00f0ff" />
            <stop offset="100%" stop-color="#ff007f" />
          </linearGradient>
        </defs>
        <circle
          class="progress-ring__circle-bg"
          stroke-width="12"
          fill="transparent"
          r="120"
          cx="140"
          cy="140"
        />
        <circle
          class="progress-ring__circle"
          stroke-width="12"
          fill="transparent"
          r="120"
          cx="140"
          cy="140"
        />
      </svg>
      <div class="time-text" id="time">45:00</div>
    </div>

    <div class="controls">
      <button class="btn" id="startBtn">Start</button>
      <button class="btn btn-secondary" id="resetBtn">Reset</button>
    </div>
  </div>

  <script>
    const TOTAL_SECONDS = 45 * 60; // 45 Minutes
    let timeRemaining = TOTAL_SECONDS;
    let timerInterval = null;
    let isRunning = false;

    const timeDisplay = document.getElementById('time');
    const startBtn = document.getElementById('startBtn');
    const resetBtn = document.getElementById('resetBtn');
    const circle = document.querySelector('.progress-ring__circle');

    // Circle circumference calculation
    const radius = circle.r.baseVal.value;
    const circumference = 2 * Math.PI * radius;

    circle.style.strokeDasharray = `${circumference} ${circumference}`;
    circle.style.strokeDashoffset = 0;

    function setProgress(percent) {
      const offset = circumference - (percent / 100) * circumference;
      circle.style.strokeDashoffset = offset; 
    }

    function updateDisplay() {
      const minutes = Math.floor(timeRemaining / 60);
      const seconds = timeRemaining % 60;
      timeDisplay.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
      
      const percentLeft = (timeRemaining / TOTAL_SECONDS) * 100;
      setProgress(percentLeft);
    }

    function toggleTimer() {
      if (isRunning) {
        clearInterval(timerInterval);
        startBtn.textContent = 'Start';
        isRunning = false;
      } else {
        startBtn.textContent = 'Pause';
        isRunning = true;
        timerInterval = setInterval(() => {
          if (timeRemaining > 0) {
            timeRemaining--;
            updateDisplay();
          } else {
            clearInterval(timerInterval);
            timeDisplay.textContent = "00:00";
            startBtn.textContent = 'Start';
            isRunning = false;
          }
        }, 1000);
      }
    }

    function resetTimer() {
      clearInterval(timerInterval);
      isRunning = false;
      timeRemaining = TOTAL_SECONDS;
      startBtn.textContent = 'Start';
      updateDisplay();
    }

    startBtn.addEventListener('click', toggleTimer);
    resetBtn.addEventListener('click', resetTimer);

    // Initial display setup
    updateDisplay();
  </script>
</body>
</html>
